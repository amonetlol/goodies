; polybar-02 - baseado em github.com/mino29/arch-i3 (.config/polybar), adaptado p/ qtile/EWMH
[colors]
include-file = $POLYBAR_PATH/themes/tokyo-night.ini

[bar/main]
include-file = $POLYBAR_PATH/modules/main.ini

[module/xworkspaces]
include-file = $POLYBAR_PATH/modules/xworkspaces.ini
[module/prev]
include-file = $POLYBAR_PATH/modules/prev.ini
[module/play-pause]
include-file = $POLYBAR_PATH/modules/play-pause.ini
[module/next]
include-file = $POLYBAR_PATH/modules/next.ini
[module/network]
include-file = $POLYBAR_PATH/modules/network.ini
[module/date]
include-file = $POLYBAR_PATH/modules/date.ini
[module/backlight]
include-file = $POLYBAR_PATH/modules/backlight.ini
[module/audio]
include-file = $POLYBAR_PATH/modules/audio.ini
[module/battery]
include-file = $POLYBAR_PATH/modules/battery.ini
[module/powermenu]
include-file = $POLYBAR_PATH/modules/powermenu.ini

[settings]
screenchange-reload = true
