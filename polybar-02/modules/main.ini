; barra principal (mino29/arch-i3 adaptada p/ qtile). Modulos da direita vem do launch.sh
enable-ipc = true
width = 100%:-40
offset-x = 18
offset-y = 18
height = 40
radius = 0.0
fixed-center = true
override-redirect = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

font-0 = Hack Nerd Font:pixelsize=13:antialias=true;3
font-1 = Hack Nerd Font:style=Regular:pixelsize=19:antialias=true;4.5
font-2 = Hack Nerd Font:style=Regular:pixelsize=15:antialias=true;3

modules-left = xworkspaces prev play-pause next
modules-center =
modules-right = ${env:POLYBAR_MODS_RIGHT}

tray-position = right
tray-maxsize = 15
tray-detached = false
tray-padding = 2
tray-scale = 1.0

cursor-click = pointer
cursor-scroll = ns-resize
