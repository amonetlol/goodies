; EWMH (qtile, bspwm, openbox...) - substitui internal/i3 do original
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = false
icon-0 = 1;
icon-1 = 2;󰈹
icon-2 = 3;
icon-3 = 4;
icon-4 = 5;
icon-5 = 6;󰎄
icon-6 = 7;󰖧
icon-7 = 8;
icon-8 = 9;
icon-default = 
format = <label-state>
label-active = %icon%
label-active-foreground = ${colors.highlight}
label-active-padding = 9px
label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = ${self.label-active-padding}
label-empty = %icon%
label-empty-foreground = ${colors.lowlight}
label-empty-padding = ${self.label-active-padding}
label-urgent = %icon%
label-urgent-foreground = ${colors.dangerous}
label-urgent-padding = ${self.label-active-padding}
