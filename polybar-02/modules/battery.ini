type = internal/battery
battery = ${env:POLYBAR_BAT:BAT0}
adapter = ${env:POLYBAR_AC:AC}
full-at = 98
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-charging-foreground = ${colors.highlight}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.lowlight}
label-full = %percentage%%
label-full-foreground = ${colors.highlight}
ramp-capacity-0 = %{F#ed404c}󰁺%{F-}
ramp-capacity-1 = %{F#ed404c}󰁻%{F-}
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = %{F#5c94e0}󰂂%{F-}
ramp-capacity-9 = %{F#5c94e0}󰁹%{F-}
ramp-capacity-foreground = ${colors.lowlight}
animation-charging-0 = 󰢜
animation-charging-1 = 󰂄
animation-charging-framerate = 750
animation-charging-foreground = ${colors.highlight}
