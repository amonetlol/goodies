; poly-min-01 — polybar minimalista no canto superior esquerdo: Hora | Data | Vol % | workspaces em dots | ícone + layout (xmonad)
; Tema Espresso (Gogh), Maple Mono NF. Instalar em ~/.config/polybar/poly-min-01 e abrir com launch.sh
[colors]
bg      = #E6323232
fg      = #EEEEEC
azul    = #8AB7D9
cinza   = #535353
vermelho= #D25252
amarelo = #FFC66D
vazio   = #9A9A9A

[bar/poly-min-01]
width = 540
height = 30
offset-x = 12
offset-y = 10
radius = 6
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 2
padding-right = 2
font-0 = "Maple Mono NF:size=11;3"
modules-left = time sep date sep vol sep ws sep layout
wm-restack = generic
enable-ipc = true
cursor-click = pointer

[module/time]
type = internal/date
interval = 5
time = %H:%M
label = %time%
format-foreground = ${colors.azul}

[module/date]
type = internal/date
interval = 60
date = %d/%m/%Y
label = %date%
format-foreground = ${colors.azul}

[module/sep]
type = custom/text
format = " | "
format-foreground = ${colors.cinza}

[module/vol]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
label-volume = Vol %percentage%%
label-volume-foreground = ${colors.azul}
label-muted = Vol mudo
label-muted-foreground = ${colors.cinza}
click-right = pwvucontrol &

[module/ws]
type = internal/xworkspaces
pin-workspaces = false
enable-scroll = false
format = <label-state>
label-active = ●
label-active-foreground = ${colors.vermelho}
label-active-padding = 1
label-occupied = ●
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1
label-urgent = ●
label-urgent-foreground = ${colors.amarelo}
label-urgent-padding = 1
label-empty = •
label-empty-foreground = ${colors.vazio}
label-empty-padding = 1

[module/layout]
; layout atual (o xmonad publica em _XMONAD_LOG, ver README): clique = próximo layout (Super+Space)
type = custom/script
exec = $HOME/.config/polybar/poly-min-01/scripts/xmonad-layout.sh
tail = true
format-foreground = ${colors.azul}
format-padding-right = 1
click-left = xdotool key --clearmodifiers super+space
