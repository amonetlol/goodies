# ──────────────────────────────────────────────
#   Hyprland Configuration
#   System: Intel Celeron N4020 · UHD 600 · 8 GB RAM
# ──────────────────────────────────────────────

# ── Monitor ──────────────────────────────────
source = ./monitors.conf

# ── Autostart ────────────────────────────────
exec-once = ~/.config/hypr/scripts/WallpaperDaemon.sh
exec-once = ~/.config/hypr/scripts/start-waybar.sh
exec-once = dunst
exec-once = foot

# ── Environment ──────────────────────────────
env = XCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt6ct

# ── Default Programs ─────────────────────────
$terminal = foot
$browser  = brave
$menu = rofi -no-config -show drun -show-icons -theme ~/.config/hypr/rofi/active-launcher.rasi
$file     = thunar

# ── Input ────────────────────────────────────
input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ── Theme ─────────────────────────────────────
source = ./colors.conf
source = ./theme.conf

# ── Animations ───────────────────────────────
animations {
    enabled = false

    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    animation = windows, 1, 3, easeOutExpo, popin 80%
    animation = windowsOut, 1, 3, easeOutExpo, popin 80%
    animation = fade, 1, 3, easeOutExpo
    animation = workspaces, 1, 3, easeOutExpo, slide
}

# ── Layouts ──────────────────────────────────
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ── Misc ─────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    initial_workspace_tracking = false
}

render {
    direct_scanout = true
}

debug {
    disable_logs = true
    vfr = true
}

# ── Keybinds ─────────────────────────────────
$mod = SUPER
bind = $mod, W, exec, firefox
bind = ALT, W, exec, firefox
bind = $mod, E, exec, thunar
bind = ALT, E, exec, thunar
bind = $mod, Return, exec, foot
bind = ALT, Return, exec, foot
bind = $mod, X, exec, ~/.config/hypr/scripts/Wlogout.sh
bind = ALT, X, exec, ~/.config/hypr/scripts/Wlogout.sh
bind = $mod, M, exec, ~/.local/bin/mon --hypr
bind = ALT, M, exec, ~/.local/bin/mon --hypr
bind = $mod, D, exec, $menu
bind = ALT, D, exec, $menu
bind = $mod SHIFT, X, exec, ~/.config/hypr/waybar/scripts/power-menu.sh


bind = $mod, Space, exec, $menu
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, layoutmsg, togglesplit,
bind = $mod, B, exec, $browser

bind = $mod, C, exec, libreoffice --writer
bind = $mod, T, exec, ~/.config/hypr/scripts/theme-selector.sh
bind = $mod, R, exec, ~/.config/hypr/scripts/random-wall.sh
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/waybar-selector.sh
bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/global-theme-selector.sh
bind = $mod SHIFT, M, exec, ~/.config/hypr/scripts/hypr-monitor-toggle.sh

# Move focus (Vim-style)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Resize windows (Arrow keys)
binde = $mod, left,  resizeactive, -20 0
binde = $mod, right, resizeactive, 20 0
binde = $mod, up,    resizeactive, 0 -20
binde = $mod, down,  resizeactive, 0 20

# Switch workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move active window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume & brightness (media keys)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Screenshot (requires grim + slurp)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, Print, exec, grim - | wl-copy

# ── Window Rules ─────────────────────────────
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

#################
### AUTOSTART ###
exec-once = ~/.config/hypr/scripts/gtkthemes
